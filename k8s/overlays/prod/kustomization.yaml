apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - ../../base

images:
  - name: yash6163/fullstack-app
    newTag: prod

patches:
  - target:
      kind: Deployment
      name: fullstack-app
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3