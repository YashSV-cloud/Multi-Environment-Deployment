<!-- frontend/index.html -->
<!DOCTYPE html>
<html>
<body>
  <h1>Simple Fullstack App</h1>
  <p id="msg">Loading...</p>

  <script>
    fetch("/api/message")
      .then(res => res.json())
      .then(data => {
        document.getElementById("msg").innerText = data.message;
      });
  </script>
</body>
</html>
