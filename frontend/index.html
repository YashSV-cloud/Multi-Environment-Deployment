<!DOCTYPE html>
<html>
<head>
  <title>Fullstack App</title>
</head>
<body>

  <h1>Simple Fullstack App</h1>

  <button onclick="getMessage()">Click Me</button>

  <p id="msg">Click button to get message</p>

  <script>
    function getMessage() {
      fetch("/api/message")
        .then(res => res.json())
        .then(data => {
          document.getElementById("msg").innerText = data.message;
        })
        .catch(err => {
          document.getElementById("msg").innerText = "Error calling backend";
        });
    }
  </script>

</body>
</html>
