name: CI/CD Pipeline

on:
  push:
    branches:
      - main   # triggers when you push to main branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    # 1️⃣ Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2️⃣ Login to Docker Hub
    - name: Login to Docker Hub
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # 3️⃣ Build Docker Image
    - name: Build Docker Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/fullstack-app:latest .

    # 4️⃣ Push Image to Docker Hub
    - name: Push Docker Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/fullstack-app:latest

    # 5️⃣ Deploy to EC2 via SSH
    - name: Deploy to EC2
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USER }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "Pulling latest image..."
          docker pull ${{ secrets.DOCKER_USERNAME }}/fullstack-app:latest

          echo "Stopping old container..."
          docker stop fullstack-app || true
          docker rm fullstack-app || true

          echo "Running new container..."
          docker run -d -p 3000:3000 --name fullstack-app ${{ secrets.DOCKER_USERNAME }}/fullstack-app:latest

          echo "Deployment successful 🚀"