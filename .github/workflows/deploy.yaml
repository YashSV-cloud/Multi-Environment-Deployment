name: Multi Env Deploy

on:
  push:
    branches: [dev, test, staging, main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Login DockerHub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build & Push Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/hello-app:${{ github.ref_name }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/hello-app:${{ github.ref_name }}

      - name: Set Namespace
        run: |
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then echo "NS=dev" >> $GITHUB_ENV; fi
          if [[ "${GITHUB_REF_NAME}" == "test" ]]; then echo "NS=test" >> $GITHUB_ENV; fi
          if [[ "${GITHUB_REF_NAME}" == "staging" ]]; then echo "NS=staging" >> $GITHUB_ENV; fi
          if [[ "${GITHUB_REF_NAME}" == "main" ]]; then echo "NS=prod" >> $GITHUB_ENV; fi

      - name: Setup kubeconfig
        run: |
          echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml
          export KUBECONFIG=$PWD/kubeconfig.yaml

      - name: Deploy
        run: |
          kubectl apply -f k8s/${NS}.yaml