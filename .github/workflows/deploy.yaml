name: CI/CD to Kubernetes (Multi-Env)

on:
  push:
    branches:
      - dev
      - test
      - staging
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    # 1️⃣ Checkout code
    - name: Checkout code
      uses: actions/checkout@v3

    # 2️⃣ Set environment variables
    - name: Set image tag based on branch
      run: |
        if [ "${GITHUB_REF_NAME}" = "main" ]; then
          echo "IMAGE_TAG=prod" >> $GITHUB_ENV
          echo "ENVIRONMENT=prod" >> $GITHUB_ENV
        else
          echo "IMAGE_TAG=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "ENVIRONMENT=${GITHUB_REF_NAME}" >> $GITHUB_ENV
        fi

    # 3️⃣ Login to Docker Hub
    - name: Docker Login
      run: |
        echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # 4️⃣ Build Docker Image
    - name: Build Image
      run: |
        docker build -t ${{ secrets.DOCKER_USERNAME }}/fullstack-app:${{ env.IMAGE_TAG }} .

    # 5️⃣ Push Docker Image
    - name: Push Image
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/fullstack-app:${{ env.IMAGE_TAG }}

    # 6️⃣ Setup kubeconfig
    - name: Set Kubeconfig
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config

    # 7️⃣ Deploy to Kubernetes
    - name: Deploy to Kubernetes
      run: |
        echo "Deploying to $ENVIRONMENT environment..."

        kubectl apply -k k8s/overlays/${{ env.ENVIRONMENT }}

        echo "Deployment completed 🚀"